modLoader="javafml"
loaderVersion="${loader_version_range}"
issueTrackerURL="https://github.com/Team-EnderIO/EnderIO/issues"
license="CC0"

[[mods]]
modId="enderio"
version="${mod_version}"
displayName="Ender IO"
authors="CrazyPants, tterrag, HenryLoenwind, MatthiasM, CyanideX, EpicSquid, Rover656, HypherionSA, liliandev, Ferri_Arnus, dphaldes"
description="Compact conduits, painted things and all sorts of stuff and bling. This is the monolithic jar, containing all core modules."
displayURL="https://enderio.com/"
logoFile="logo.png"
featureFlags="META-INF/feature_flags.json"

[[mixins]]
config="enderio.mixins.json"

[[dependencies.enderio]]
modId="minecraft"
type="required"
versionRange="${mcversion}"
side="BOTH"

[[dependencies.enderio]]
modId="neoforge"
type="required"
versionRange="${neo_version}"
side="BOTH"

[[dependencies.enderio]]
modId="endercore"
type="required"
versionRange="${mod_version}"
side="BOTH"

# FTB Ultimine Compat
[[dependencies.enderio]]
modId="ftbultimine"
type="optional"
versionRange="${ftbUltimine_version_range}"
side="BOTH"

# Modded conduits
[[dependencies.enderio]]
modId="mekanism"
type="optional"
versionRange="${mekanism_version_range}"
side="BOTH"

[[dependencies.enderio]]
modId="ae2"
type="optional"
versionRange="${ae2_version_range}"
side="BOTH"

[[dependencies.enderio]]
modId="refinedstorage"
type="optional"
versionRange="${refinedstorage_version_range}"
side="BOTH"
