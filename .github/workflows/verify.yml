name: Game and Unit Tests

permissions:
  contents: read

on:
  push:
    branches: # These rules cover old and new version schemes. 26.1-snapshot-1, 1.21.1, etc.
      - '[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*-*'
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-*'
  pull_request:
    branches: # These rules cover old and new version schemes. 26.1-snapshot-1, 1.21.1, etc.
      - '[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*-*'
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-*'
    types:
      - synchronize
      - opened
      - ready_for_review
      - reopened
    paths:
      - '**.java'

jobs:
  test:
    name: Run Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # Prevent doubling up of test runs
    concurrency:
      group: test_build-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache: true

      - name: Run Game Tests with Gradle
        run: ./gradlew runGameTestServer --build-cache

      - name: Run Unit Tests with Gradle
        run: ./gradlew test --build-cache
