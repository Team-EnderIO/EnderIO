name: Game and Unit Tests

permissions:
  contents: read

on:
  push:
    branches: # These rules cover old and new version schemes. 26.1-snapshot-1, 1.21.1, etc.
      - '[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*-*'
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-*'
  pull_request:
    branches: # These rules cover old and new version schemes. 26.1-snapshot-1, 1.21.1, etc.
      - '[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*-*'
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-*'
    types:
      - synchronize
      - opened
      - ready_for_review
      - reopened
    paths:
      - '**.java'

jobs:
  test:
    name: Run Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # Prevent doubling up of test runs
    concurrency:
      group: test_build-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          
      - uses: gradle/actions/wrapper-validation@v6

      - uses: gradle/actions/setup-gradle@v6

      - name: Run Game Tests with Gradle
        run: ./gradlew runGameTestServer

      - name: Run Unit Tests with Gradle
        # Run even if game tests failed so both reports are produced
        if: ${{ !cancelled() }}
        run: ./gradlew test

      # Upload for test-report to pick up
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn
