name: Nightly Build
env:
  BUILD_NUMBER: ${{ github.run_number }}

# Run on all develop pushes
on:
  push:
    branches: # These rules cover old and new version schemes. 26.1-snapshot-1, 1.21.1, etc.
      - '[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*-*'
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-*'

# Cancel if a new push is sent
# https://stackoverflow.com/a/70972844
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-build
          path: |
            enderio/build/libs/*.jar

      - name: Discord Notification Success
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.NIGHTLY_DISCORD_WEBHOOK }}
          title: "Ender IO nightly build for Minecraft ${{ github.ref_name }}"
          description: |
            A new nightly build of Ender IO has been built for Minecraft `${{ github.ref_name }}`. If you play with this, please remember to report issues!
            [Download build #${{ github.run_number }}](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/nightly-build.zip)

            **Latest commit**
            ```
            ${{ github.event.head_commit.message }}
            ```
          avatar_url: https://raw.githubusercontent.com/Team-EnderIO/EnderIO/dev/1.20.1/doc/img/enderface.png
          username: Ender IO Nightowl
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          color: 0x57F287
          noprefix: true
          nodetail: true
          nocontext: true

      - name: Discord Notification Failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.NIGHTLY_DISCORD_WEBHOOK }}
          title: "Nightly build failed for Minecraft ${{ github.ref_name }}"
          description: |
            The nightly build (#${{ github.run_number }}) for Minecraft `${{ github.ref_name }}` failed to compile at this commit. [View the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Latest commit**
            ```
            ${{ github.event.head_commit.message }}
            ```
          avatar_url: https://raw.githubusercontent.com/Team-EnderIO/EnderIO/dev/1.20.1/doc/img/gray-enderface.png
          username: Ender IO Nightowl
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          color: 0xED4245
          noprefix: true
          nodetail: true
          nocontext: true
