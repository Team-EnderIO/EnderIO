name: Release Build

# Run when release is created on GitHub
on:
  release:
    types: [ published ]

jobs:
  build:
    name: Build & Publish Maven
    runs-on: ubuntu-latest
    env:
      CI: true
      BUILD_VERSION: ${{ github.event.release.tag_name }}
      CHANGELOG: ${{ github.event.release.body }}
      PUBLISH: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Clean
        run: ./gradlew clean

      - name: Build
        run: ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: enderio/build/libs/*.jar

      - name: Publish to Maven
        env:
          RVR_MAVEN_USER: ${{ secrets.RVR_MAVEN_USER }}
          RVR_MAVEN_PASSWORD: ${{ secrets.RVR_MAVEN_PASSWORD }}
        run: ./gradlew publishAllPublicationsToRover656Repository

  publish-github:
    name: Publish to GitHub
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: build/libs

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: build/libs/*.jar

  publish-curseforge:
    name: Publish to CurseForge
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: build/libs

      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          name: Ender IO - ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          files: |
            build/libs/!(*-@(api|sources)).jar
            build/libs/*-@(api|sources).jar
          changelog: ${{ github.event.release.body }}
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            jei(optional){curseforge:238222}
            athena(optional){curseforge:841890}
            applied-energistics-2(optional){curseforge:223794}
            mekanism(optional){curseforge:268560}
            cc-tweaked(optional){curseforge:282001}

          curseforge-id: 64578
          curseforge-token: ${{ secrets.TOKEN_CURSEFORGE }}

  publish-modrinth:
    name: Publish to Modrinth
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: build/libs

      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          name: Ender IO - ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          files: |
            build/libs/!(*-@(api|sources)).jar
            build/libs/*-@(api|sources).jar
          changelog: ${{ github.event.release.body }}
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            jei(optional){modrinth:u6dRKJwZ}
            athena(optional){modrinth:b1ZV3DIJ}
            applied-energistics-2(optional){modrinth:XxWD5pD3}
            mekanism(optional){modrinth:Ce6I4WUE}
            cc-tweaked(optional){modrinth:gu7yAYhd}

          modrinth-id: 49ZofO4f
          modrinth-token: ${{ secrets.TOKEN_MODRINTH }}

  notify-success:
    name: Discord Success Notification
    needs: [ build, publish-github, publish-curseforge, publish-modrinth ]
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Truncate Build Notes
        uses: 2428392/gh-truncate-string-action@v1.2.0
        id: truncatedChangelog
        with:
          stringToTruncate: ${{ github.event.release.body }}
          maxLength: 1000

      - name: Discord Notification Success
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.RELEASE_DISCORD_WEBHOOK }}
          embed-title: Ender IO ${{ github.event.release.tag_name }} Released for MC ${{ github.ref_name }}
          embed-description: ${{ steps.truncatedChangelog.outputs.string }}
          avatar-url: https://raw.githubusercontent.com/Team-EnderIO/EnderIO/dev/1.20.1/doc/img/enderface.png
          username: Ender IO Releases
          embed-footer-text: ${{ github.event.release.tag_name }} for MC ${{ github.ref_name }}
          embed-url: ${{ github.event.release.html_url }}
          embed-color: 5763719

  notify-failure:
    name: Discord Failure Notification
    needs: [ build, publish-github, publish-curseforge, publish-modrinth ]
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Discord Notification Failure
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.PRIVATE_DISCORD_WEBHOOK }}
          embed-title: ${{ github.event.release.tag_name }} for MC ${{ github.ref_name }} build failed
          embed-description: The release build is failing at this commit. ```${{ github.event.head_commit.message }}```
          avatar-url: https://raw.githubusercontent.com/Team-EnderIO/EnderIO/dev/1.20.1/doc/img/gray-enderface.png
          username: Ender IO Release Failure
          embed-footer-text: ${{ github.event.release.tag_name }} for MC ${{ github.ref_name }}
          embed-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          embed-color: 15548997
